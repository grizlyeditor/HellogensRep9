name: Build Forge 1.12.2 Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v2

    - name: Set up Java 8
      uses: actions/setup-java@v2
      with:
        java-version: '8'
        distribution: 'adopt'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build mod
      run: ./gradlew build

    - name: Upload built mod
      uses: actions/upload-artifact@v3
      with:
        name: WindMazeSwordMod
        path: build/libs/*.jar
