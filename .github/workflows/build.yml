name: Build Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repo
      uses: actions/checkout@v3

    - name: Setup JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'adopt'

    - name: Grant gradlew permission
      run: chmod +x gradlew

    - name: Build Mod
      run: ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: visualmace-jar
        path: build/libs/*.jar
